org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---------------------------------------------------------------------------
# This repository lives at a path containing a space AND a backtick
# ("Codeamble `26"). The Kotlin incremental compiler cannot close its .tab
# cache files under such a path and fails every plugin module with
# "Could not close incremental caches". Non-incremental compilation writes no
# such caches, so it builds cleanly. Costs a few seconds on a rebuild.
# Remove this line if the project ever moves to a plain path.
# ---------------------------------------------------------------------------
kotlin.incremental=false
